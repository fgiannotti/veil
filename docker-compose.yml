services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: veil_db
    environment:
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
      POSTGRES_DB: veil
    ports:
      - "5432:5432"
    volumes:
      - veil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: mailhog/mailhog:latest
    container_name: veil_mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  veil_pgdata:
